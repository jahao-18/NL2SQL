tables:
  college:
    business_name: 学院
    grain: 一行代表一个二级学院。
  major:
    business_name: 专业
    grain: 一行代表一个专业。
  class_group:
    business_name: 班级
    grain: 一行代表一个行政班级。
  student:
    business_name: 学生
    grain: 一行代表一名学生。
    default_filters:
      - status = 'active'
  teacher:
    business_name: 教师
    grain: 一行代表一名教师。
  course:
    business_name: 课程
    grain: 一行代表一门课程。
  course_prerequisite:
    business_name: 先修课程关系
    grain: 一行代表一门课程的一条先修要求。
  teaching_class:
    business_name: 开课班
    grain: 一行代表某学年学期的一次开课。
    default_time_column: year
  enrollment:
    business_name: 选课记录
    grain: 一行代表一名学生选择一个开课班。
    default_time_column: enroll_time
  score:
    business_name: 成绩
    grain: 一行代表一条选课记录的成绩。
  evaluation:
    business_name: 教学评价
    grain: 一行代表学生对开课班的一次评价。
  assignment:
    business_name: 作业
    grain: 一行代表开课班发布的一次作业、测验、项目或实验。
    default_time_column: publish_time
  assignment_submission:
    business_name: 作业提交
    grain: 一行代表一名学生对一次作业的提交结果。
    default_time_column: submit_time
  attendance:
    business_name: 考勤记录
    grain: 一行代表一名学生在某开课班某次课的考勤状态。
    default_time_column: class_date
  learning_activity:
    business_name: 学习行为
    grain: 一行代表一名学生在某开课班某天的学习平台行为汇总。
    default_time_column: activity_date
  scholarship:
    business_name: 奖助记录
    grain: 一行代表一名学生获得的一条奖助记录。
    default_time_column: year
  academic_warning:
    business_name: 学业预警
    grain: 一行代表一名学生在某学期的一条风险预警。
    default_time_column: year
columns:
  student:
    student_no:
      business_name: 学号
      semantic_type: identifier
      sensitive: true
    name:
      business_name: 学生姓名
      semantic_type: dimension
    status:
      business_name: 学籍状态
      semantic_type: dimension
      enum_values:
        - active=在读
        - graduated=毕业
        - suspended=休学
      default_filter: status = 'active'
  teacher:
    teacher_no:
      business_name: 工号
      semantic_type: identifier
      sensitive: true
    name:
      business_name: 教师姓名
      semantic_type: dimension
    title:
      business_name: 职称
      semantic_type: dimension
  course:
    course_type:
      business_name: 课程类型
      semantic_type: dimension
      enum_values:
        - required=必修课
        - elective=选修课
        - general=通识课
    credit:
      business_name: 学分
      semantic_type: metric
      default_aggregation: avg
      unit: 学分
    difficulty:
      business_name: 难度系数
      semantic_type: metric
      default_aggregation: avg
  score:
    usual_score:
      business_name: 平时成绩
      semantic_type: metric
      default_aggregation: avg
      unit: 分
    exam_score:
      business_name: 考试成绩
      semantic_type: metric
      default_aggregation: avg
      unit: 分
    final_score:
      business_name: 总评成绩
      semantic_type: metric
      default_aggregation: avg
      unit: 分
    grade_point:
      business_name: 绩点
      semantic_type: metric
      default_aggregation: avg
    passed:
      business_name: 是否通过
      semantic_type: dimension
  evaluation:
    score:
      business_name: 教学评价分
      semantic_type: metric
      default_aggregation: avg
      unit: 分
    comment:
      business_name: 评价内容
      semantic_type: dimension
      sensitive: true
  assignment_submission:
    score:
      business_name: 作业得分
      semantic_type: metric
      default_aggregation: avg
    late:
      business_name: 是否迟交
      semantic_type: dimension
    status:
      business_name: 提交状态
      semantic_type: dimension
      enum_values:
        - submitted=已提交
        - late=迟交
        - missing=未提交
  attendance:
    status:
      business_name: 考勤状态
      semantic_type: dimension
      enum_values:
        - present=出勤
        - late=迟到
        - absent=缺勤
        - leave=请假
  learning_activity:
    login_count:
      business_name: 登录次数
      semantic_type: metric
      default_aggregation: sum
    video_minutes:
      business_name: 视频学习分钟数
      semantic_type: metric
      default_aggregation: sum
      unit: 分钟
    resource_views:
      business_name: 资源浏览次数
      semantic_type: metric
      default_aggregation: sum
    discussion_posts:
      business_name: 讨论发帖数
      semantic_type: metric
      default_aggregation: sum
  scholarship:
    amount:
      business_name: 奖助金额
      semantic_type: metric
      default_aggregation: sum
      unit: 元
  academic_warning:
    risk_score:
      business_name: 风险分
      semantic_type: metric
      default_aggregation: avg
    resolved:
      business_name: 是否解除
      semantic_type: dimension
relations:
  - left: major.college_id
    right: college.id
    type: many_to_one
  - left: class_group.major_id
    right: major.id
    type: many_to_one
  - left: student.college_id
    right: college.id
    type: many_to_one
  - left: student.major_id
    right: major.id
    type: many_to_one
  - left: student.class_id
    right: class_group.id
    type: many_to_one
  - left: teacher.college_id
    right: college.id
    type: many_to_one
  - left: course.college_id
    right: college.id
    type: many_to_one
  - left: course_prerequisite.course_id
    right: course.id
    type: many_to_one
  - left: course_prerequisite.prerequisite_course_id
    right: course.id
    type: many_to_one
  - left: teaching_class.course_id
    right: course.id
    type: many_to_one
  - left: teaching_class.teacher_id
    right: teacher.id
    type: many_to_one
  - left: enrollment.teaching_class_id
    right: teaching_class.id
    type: many_to_one
  - left: enrollment.student_id
    right: student.id
    type: many_to_one
  - left: score.enrollment_id
    right: enrollment.id
    type: one_to_one
  - left: evaluation.teaching_class_id
    right: teaching_class.id
    type: many_to_one
  - left: evaluation.student_id
    right: student.id
    type: many_to_one
  - left: assignment.teaching_class_id
    right: teaching_class.id
    type: many_to_one
  - left: assignment_submission.assignment_id
    right: assignment.id
    type: many_to_one
  - left: assignment_submission.student_id
    right: student.id
    type: many_to_one
  - left: attendance.teaching_class_id
    right: teaching_class.id
    type: many_to_one
  - left: attendance.student_id
    right: student.id
    type: many_to_one
  - left: learning_activity.teaching_class_id
    right: teaching_class.id
    type: many_to_one
  - left: learning_activity.student_id
    right: student.id
    type: many_to_one
  - left: scholarship.student_id
    right: student.id
    type: many_to_one
  - left: academic_warning.student_id
    right: student.id
    type: many_to_one
metrics:
  学生人数:
    formula: COUNT(student.id)
    default_filters:
      - student.status = 'active'
  选课人次:
    formula: COUNT(enrollment.id)
    default_time_column: teaching_class.year
  平均分:
    formula: AVG(score.final_score)
    default_time_column: teaching_class.year
  及格率:
    formula: AVG(CASE WHEN score.final_score >= 60 THEN 1.0 ELSE 0.0 END)
    default_time_column: teaching_class.year
  挂科率:
    formula: AVG(CASE WHEN score.final_score < 60 THEN 1.0 ELSE 0.0 END)
    default_time_column: teaching_class.year
  作业提交率:
    formula: AVG(CASE WHEN assignment_submission.status <> 'missing' THEN 1.0 ELSE 0.0 END)
    default_time_column: assignment.due_time
  作业迟交率:
    formula: AVG(CASE WHEN assignment_submission.late = 1 THEN 1.0 ELSE 0.0 END)
    default_time_column: assignment.due_time
  出勤率:
    formula: AVG(CASE WHEN attendance.status = 'present' THEN 1.0 ELSE 0.0 END)
    default_time_column: attendance.class_date
  缺勤率:
    formula: AVG(CASE WHEN attendance.status = 'absent' THEN 1.0 ELSE 0.0 END)
    default_time_column: attendance.class_date
  学习活跃度:
    formula: SUM(learning_activity.login_count + learning_activity.resource_views + learning_activity.discussion_posts)
    default_time_column: learning_activity.activity_date
  奖助金额:
    formula: SUM(scholarship.amount)
    default_time_column: scholarship.year
  未解除预警数:
    formula: SUM(CASE WHEN academic_warning.resolved = 0 THEN 1 ELSE 0 END)
    default_time_column: academic_warning.year
